[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neorunner"
version = "2.4.0"
description = "Production-grade Minecraft server management with dashboard"
authors = [{name = "NeoRunner Team"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "flask>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "apscheduler>=3.10.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "pytest-asyncio>=0.21.0",
]
test = [
    "playwright>=1.40.0",
]

[project.scripts]
neorunner = "neorunner_pkg.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neorunner_pkg*"]

[tool.setuptools.package-data]
neorunner_pkg = [
    "templates/*.html",
    "client_installer/*.java",
    "static/*",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# The following rules are intentionally disabled:
# - BLE001: catch-all `except Exception` handlers are used throughout as a
#   deliberate defensive pattern in this daemon (a crashed background task or
#   failed network call must never take down the whole service).
# - S110/S112: bare `try: ... except: pass/continue` follows the same principle
#   (best-effort cleanup/logging that must never fail startup or loops).
# These patterns were reviewed during the 2026 ruff cleanup; they are
# functional intent, not accidental.
ignore = [
    "BLE001",
    "S110",
    "S112",
]